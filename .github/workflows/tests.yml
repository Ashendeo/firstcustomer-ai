name: Python checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Syntax check
        run: python -m compileall -q app tests alembic
      - name: Database migration smoke test
        run: DATABASE_URL=sqlite:///./ci-checkpoints.db alembic upgrade head
      - name: Run test suite
        run: python -m pytest -q
